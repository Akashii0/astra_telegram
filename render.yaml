# render.yaml — Astra Bot deployment blueprint
# Deploy via Render Dashboard → New + → Blueprint
#
# BEFORE DEPLOYING:
#   1. Commit uv.lock to your repo root (Render uses it to detect uv)
#   2. Have your BOT_TOKEN, NVIDIA_API_KEY ready
#   3. Set WEBHOOK_BASE_URL after the first deploy (see note below)

services:
  - type: web
    name: astra-bot
    runtime: python
    plan: free                    # see caveat below about spin-down
    branch: main
    autoDeploy: true
    healthCheckPath: /health      # your existing /health route

    # ── Build: install uv, then sync from lockfile ──────────────
    buildCommand: pip install uv && uv sync --frozen

    # ── Start: run uvicorn through the uv venv ──────────────────
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      # ── Python + uv versions (3.14 is Render's default) ───────
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: UV_VERSION
        value: "0.10.2"

      # ── Secrets: fill these in the Render dashboard ────────────
      - key: BOT_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false               # set to https://astra-bot.onrender.com after first deploy

      # ── Auto-generated by Render ───────────────────────────────
      - key: WEBHOOK_SECRET
        generateValue: true       # Render makes a strong random value

      # ── NVIDIA config (non-secret) ─────────────────────────────
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
